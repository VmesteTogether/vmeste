<style>
/* ── index-only: the tool grid ── */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

.tool-card {
  display: flex; flex-direction: column; gap: 10px;
  padding: 24px;
  background: var(--tar);
  text-decoration: none;
  position: relative;
  transition: background 100ms linear;
}
.tool-card:hover { background: var(--slab); }
.tool-card:hover .tool-name { color: var(--acid); }
.tool-card:hover .tool-num  { color: var(--acid-dim); }
.tool-card::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; background: var(--acid);
  transform: scaleX(0); transform-origin: left;
  transition: transform 160ms linear;
}
.tool-card:hover::after { transform: scaleX(1); }

.tool-num {
  font-family: var(--mono); font-size: var(--t-micro); font-weight: 700;
  letter-spacing: 0.18em; color: var(--ghost);
  transition: color 100ms linear;
}
.tool-name {
  font-family: var(--shout); font-weight: 800; font-size: 26px; line-height: 1;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--bone);
  transition: color 100ms linear;
}
.tool-tags {
  margin-top: auto; padding-top: 12px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.tool-tag {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ghost); border: 1px solid var(--line); padding: 3px 7px;
}
.tool-card--toy .tool-tag { color: var(--toxic); border-color: var(--toxic); }

</style>
